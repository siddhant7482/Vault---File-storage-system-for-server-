# Local development database for Vault.
#
# Deliberately a SEPARATE database from Warden's, on the same server:
# each CommandHQ app owns its schema outright, so a migration in one
# cannot break another and a restore is per-app. On the node this is
# CT 100 with one database per app; here it is one container with two.
#
# Garage is not here. The fs storage driver needs no infrastructure,
# which is the whole reason it exists — bring Garage up on the node,
# flip STORAGE_DRIVER, run a scan.
services:
  postgres:
    image: postgres:17-alpine
    container_name: vault-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: commandhq
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: vault
    ports:
      - "5434:5432"          # 5433 is Warden's; this avoids the clash
    volumes:
      - vaultdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commandhq"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vaultdata:
